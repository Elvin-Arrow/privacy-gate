[package]
name = "privacy-gate"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "^2.0"

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "^1", features = ["full"] }
tracing = "^0.1"
tracing-subscriber = "^0.3"

# Core crate (from workspace)
pg-core = { path = "../core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
