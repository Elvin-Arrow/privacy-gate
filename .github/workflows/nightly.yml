# Nightly

# testing.md §11: ONNX golden + model pin (nightly / release). Informational skip of
# the shipped-artifact assertion when `models/ner-pii.onnx` is absent (PRs may skip
# heavy weights); a vendored file that does not match `NER_PII_ONNX_SHA256` fails.

name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  onnx-golden:
    name: ONNX golden + model pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev

      - name: Hybrid fixture goldens and pin check
        run: cargo test -p pg-core --test hybrid_w15a -- --nocapture

  ollama-golden:
    name: Ollama golden (informational without daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev

      - name: Mock-backed §7.4 suite (always)
        run: cargo test -p pg-core --test ollama_w15b -- --nocapture

      - name: Real-Ollama handshake (informational)
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "informational skip: ollama not on runner (decision 0009 / testing.md §11)"
            exit 0
          fi
          cargo test -p pg-core --test ollama_w15b nightly_real_ollama -- --ignored --nocapture

  perf-budgets:
    name: Perf budgets (design.md §7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev

      - name: Perf budgets (design.md §7; testing.md §8 "not a flaky PR gate")
        run: cargo test -p pg-core --test perf_w39 -- --ignored --nocapture

  mutants-core:
    name: Full-crate mutants (testing.md §5.6)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "1"
      MUTANTS_IN_PLACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutate pg-core minus testing.md §5.4
        run: bash scripts/mutation-gate.sh nightly
